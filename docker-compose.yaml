services:
  blue:
    build: ./app
    container_name: blue-app
    environment:
      - VERSION=blue
    ports:
      - "3001:3000"

  green:
    build: ./app
    container_name: green-app
    environment:
      - VERSION=green
    ports:
      - "3002:3000"

  nginx:
    image: nginx:alpine
    container_name: blue-green-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - blue
      - green
